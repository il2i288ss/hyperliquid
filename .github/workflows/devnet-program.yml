name: Devnet program deploy

# Builds the long/short program in TEST mode (short waits, see math.rs
# TEST_BUILD) and deploys or upgrades it on devnet with DEVNET_KEYPAIR.
#
# The program-id keypair lives on the `devnet-program` branch of this private
# repo so upgrades keep the same address. It only fixes the program's address;
# upgrades are authorised by the deployer wallet. Devnet only.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: devnet-program

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        # every step's output is also saved, so failures can be published
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Install Solana CLI + Anchor
        run: |
          mkdir -p /tmp/logs
          {
            sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
            echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
            cargo install --git https://github.com/coral-xyz/anchor --tag v0.31.1 avm --locked --force
            avm install 0.31.1 && avm use 0.31.1

          } 2>&1 | tee /tmp/logs/install.txt
      - name: Wallet + program id
        env:
          DEVNET_KEYPAIR: ${{ secrets.DEVNET_KEYPAIR }}
        run: |
          mkdir -p /tmp/logs
          {
            [ -n "$DEVNET_KEYPAIR" ] || { echo "DEVNET_KEYPAIR secret missing"; exit 1; }
            printf '%s' "$DEVNET_KEYPAIR" > /tmp/deployer.json && chmod 600 /tmp/deployer.json
            solana config set --url devnet --keypair /tmp/deployer.json
            mkdir -p target/deploy
            if git fetch -q --depth 1 origin devnet-program 2>/dev/null && git show FETCH_HEAD:program-keypair.json > target/deploy/leverage-keypair.json 2>/dev/null; then
              echo "Reusing program id"
            else
              solana-keygen new --no-bip39-passphrase --silent -o target/deploy/leverage-keypair.json --force
              echo "New program id"
            fi
            echo "PROGRAM_ID=$(solana-keygen pubkey target/deploy/leverage-keypair.json)" >> "$GITHUB_ENV"
            solana balance

          } 2>&1 | tee /tmp/logs/wallet.txt
      - name: Build (test mode)
        run: |
          mkdir -p /tmp/logs
          {
            anchor keys sync
            anchor build -- --features devnet-test
            ls -la target/deploy target/idl

          } 2>&1 | tee /tmp/logs/build.txt
      - name: Deploy
        run: |
          mkdir -p /tmp/logs
          {
            solana program deploy target/deploy/leverage.so \
              --program-id target/deploy/leverage-keypair.json \
              --with-compute-unit-price 10000 --max-sign-attempts 30
            solana program show "$PROGRAM_ID"
            solana balance

          } 2>&1 | tee /tmp/logs/deploy.txt
      - name: Publish program id + IDL
        if: success()
        run: |
          mkdir -p /tmp/pub
          cp target/deploy/leverage-keypair.json /tmp/pub/program-keypair.json
          cp target/idl/leverage.json /tmp/pub/leverage.json
          cp target/types/leverage.ts /tmp/pub/leverage.ts
          echo "$PROGRAM_ID" > /tmp/pub/program-id.txt
          cd /tmp/pub
          git init -q -b devnet-program
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -q -m "devnet program ${PROGRAM_ID} @ ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" devnet-program

      - name: Publish logs on failure
        if: failure()
        run: |
          cd /tmp/logs 2>/dev/null || { mkdir -p /tmp/logs && cd /tmp/logs; echo none > none.txt; }
          git init -q -b devnet-logs
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -q -m "deploy logs ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" devnet-logs
