name: Devnet long/short test

# Full on-chain test of the long/short program on devnet (open, caps, pause,
# close, liquidation, take profit / stop loss). Results -> devnet-lev-test.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: devnet

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: scripts } }
    env:
      RPC_URL: ${{ vars.DEVNET_RPC_URL || 'https://api.devnet.solana.com' }}
      ADMIN_KEYPAIR: ${{ github.workspace }}/devnet.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Wallet + program id
        env:
          DEVNET_KEYPAIR: ${{ secrets.DEVNET_KEYPAIR }}
        run: |
          printf '%s' "$DEVNET_KEYPAIR" > "$ADMIN_KEYPAIR"; chmod 600 "$ADMIN_KEYPAIR"
          git clone -q --depth 1 -b devnet-program "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" /tmp/program
          echo "LEVERAGE_PROGRAM_ID=$(cat /tmp/program/program-id.txt)" >> "$GITHUB_ENV"
          npx tsx src/devnet-wallet.ts "$ADMIN_KEYPAIR" 0.6
      - name: Long/short smoke test
        run: npm run smoke:leverage 2>&1 | tee /tmp/lev-test.txt
      - name: Publish
        if: always()
        run: |
          mkdir -p /tmp/out && cp /tmp/lev-test.txt /tmp/out/ 2>/dev/null || echo none > /tmp/out/lev-test.txt
          cp leverage-smoke-result.json /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q -b devnet-lev-test
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m "devnet long/short test ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" HEAD:devnet-lev-test
