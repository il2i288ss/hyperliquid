name: Devnet set keeper

# Authorizes the hosted keeper's wallet on the devnet long/short program and
# sends it 0.5 devnet SOL for fees. Triggered by scripts/setup-keeper.sh.
on:
  workflow_dispatch:
    inputs:
      keeper:
        description: Keeper wallet address (public key)
        required: true

permissions:
  contents: read

concurrency: devnet

jobs:
  set:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: scripts } }
    env:
      RPC_URL: ${{ vars.DEVNET_RPC_URL || 'https://api.devnet.solana.com' }}
      ADMIN_KEYPAIR: ${{ github.workspace }}/devnet.json
      KEEPER_PUBKEY: ${{ inputs.keeper }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Authorize keeper
        env:
          DEVNET_KEYPAIR: ${{ secrets.DEVNET_KEYPAIR }}
        run: |
          printf '%s' "$DEVNET_KEYPAIR" > "$ADMIN_KEYPAIR"; chmod 600 "$ADMIN_KEYPAIR"
          git clone -q --depth 1 -b devnet-program "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" /tmp/program
          export LEVERAGE_PROGRAM_ID="$(cat /tmp/program/program-id.txt)"
          npx tsx src/devnet-set-keeper.ts
