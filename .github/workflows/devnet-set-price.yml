name: Devnet set SOL price

# Devnet test knob: the SOL/USD rate used for market caps and long/short
# tiers. e.g. 3000 makes "$100K" reachable with ~10 devnet SOL.
on:
  workflow_dispatch:
    inputs:
      sol_usd:
        description: SOL price in USD used on devnet
        default: "3000"

permissions:
  contents: read

concurrency: devnet

jobs:
  set:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: scripts } }
    env:
      RPC_URL: ${{ vars.DEVNET_RPC_URL || 'https://api.devnet.solana.com' }}
      ADMIN_KEYPAIR: ${{ github.workspace }}/devnet.json
      SOL_USD: ${{ inputs.sol_usd }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - env:
          DEVNET_KEYPAIR: ${{ secrets.DEVNET_KEYPAIR }}
        run: |
          printf '%s' "$DEVNET_KEYPAIR" > "$ADMIN_KEYPAIR"; chmod 600 "$ADMIN_KEYPAIR"
          git clone -q --depth 1 -b devnet-program "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" /tmp/program
          export LEVERAGE_PROGRAM_ID="$(cat /tmp/program/program-id.txt)"
          npx tsx src/devnet-set-params.ts
