name: CI logs

# Publishes full build/typecheck output and the Meteora SDK type definitions
# to the `ci-logs` branch, so they can be read with git.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Collect output
        env:
          NEXT_PUBLIC_RPC_URL: https://api.devnet.solana.com
          NEXT_PUBLIC_NETWORK: devnet
          NEXT_PUBLIC_DBC_CONFIG: So11111111111111111111111111111111111111112
        run: |
          mkdir -p /tmp/out/sdk
          (cd scripts && npm install --no-audit --no-fund && npx tsc --noEmit) > /tmp/out/scripts-typecheck.txt 2>&1 || true
          (cd app && npm install --no-audit --no-fund && npm run build) > /tmp/out/app-build.txt 2>&1 || true
          SDK=scripts/node_modules/@meteora-ag/dynamic-bonding-curve-sdk
          cp $SDK/package.json /tmp/out/sdk/
          find $SDK/dist -name "*.d.ts" -exec cp {} /tmp/out/sdk/ \; || true
          cp $SDK/dist/index.js /tmp/out/sdk/index.js 2>/dev/null || cp $SDK/dist/index.cjs /tmp/out/sdk/index.js 2>/dev/null || true
          (cd scripts && npm ls --depth=0) > /tmp/out/versions.txt 2>&1 || true
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)" > /dev/null 2>&1 || true
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          (solana --version && cargo build-sbf --manifest-path programs/leverage/Cargo.toml && ls -la target/deploy) > /tmp/out/program-sbf.txt 2>&1 || true
      - name: Push to ci-logs branch
        run: |
          cd /tmp/out
          git init -q -b ci-logs
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -q -m "logs for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" ci-logs
